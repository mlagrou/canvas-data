name: Sync Canvas Data

on:
  schedule:
    - cron: "0 7,12,17,22 * * *"   # 7am, noon, 5pm, 10pm UTC — adjust to your timezone
  workflow_dispatch:                 # lets you trigger a manual sync from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install canvasapi python-dotenv

      - name: Fetch Canvas data
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_KEY: ${{ secrets.CANVAS_API_KEY }}
        run: python fetch_canvas.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet \
            || git commit -m "Canvas sync $(date -u '+%Y-%m-%d %H:%M UTC')" \
            && git push
