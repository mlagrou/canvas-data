<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e2e8f0;
      --muted:    #8892a4;
      --green:    #34d399;
      --yellow:   #fbbf24;
      --red:      #f87171;
      --blue:     #60a5fa;
      --purple:   #c084fc;
      --radius:   12px;
      --sidebar:  255px;
      --font:     'Inter', system-ui, -apple-system, sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app { display: flex; flex: 1; }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .logo { padding: 22px 18px 18px; border-bottom: 1px solid var(--border); }
    .logo h1 {
      font-size: 1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo .tagline { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }

    .nav { padding: 10px 0; flex: 1; }
    .nav-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 18px 4px; }
    .nav-btn {
      display: flex; align-items: center; gap: 9px;
      width: 100%; padding: 8px 18px;
      background: none; border: none; color: var(--muted);
      font-size: 0.845rem; cursor: pointer; transition: color 0.15s, background 0.15s; text-align: left;
    }
    .nav-btn:hover { color: var(--text); background: var(--surface2); }
    .nav-btn.active { color: var(--accent2); background: rgba(108,99,255,0.12); font-weight: 500; }
    .nav-btn .badge {
      margin-left: auto; background: var(--accent); color: #fff;
      font-size: 0.63rem; font-weight: 700; padding: 2px 6px; border-radius: 9px; min-width: 18px; text-align: center;
    }

    .course-filter { padding: 6px 0; border-top: 1px solid var(--border); }
    .course-chip {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 7px 18px;
      background: none; border: none; color: var(--muted);
      font-size: 0.78rem; cursor: pointer; transition: color 0.15s, background 0.15s; text-align: left;
    }
    .course-chip:hover { color: var(--text); background: var(--surface2); }
    .course-chip.active { color: var(--text); font-weight: 500; }
    .course-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .course-chip .course-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sync-info { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--muted); }
    .sync-time { color: var(--text); font-weight: 500; display: block; margin-top: 2px; }

    /* ── Main ────────────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar {
      position: sticky; top: 0;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 13px 26px; display: flex; align-items: center; gap: 12px; z-index: 10;
    }
    .topbar h2 { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .search {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; color: var(--text); font-size: 0.83rem; width: 210px;
      outline: none; transition: border-color 0.15s;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--accent); }

    .content { padding: 22px 26px; flex: 1; overflow-y: auto; }

    /* ── Section headers ─────────────────────────────────────────────── */
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; margin-top: 6px; }
    .section-header h3 { font-size: 0.88rem; font-weight: 600; }
    .section-count { font-size: 0.72rem; color: var(--muted); background: var(--surface2); padding: 2px 7px; border-radius: 5px; }
    .section-sep { height: 1px; background: var(--border); flex: 1; }

    /* ── List cards (all non-calendar views) ─────────────────────────── */
    .card-grid { display: grid; gap: 9px; margin-bottom: 28px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 15px; display: flex; gap: 13px; align-items: flex-start;
      transition: border-color 0.15s, transform 0.1s; text-decoration: none; color: inherit;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card.is-new { border-color: rgba(108,99,255,0.45); background: linear-gradient(135deg, var(--surface) 0%, rgba(108,99,255,0.06) 100%); }
    .card.is-overdue  { border-left: 3px solid var(--red); }
    .card.is-due-soon { border-left: 3px solid var(--yellow); }
    .card.is-submitted{ border-left: 3px solid var(--green); }
    .card.is-ai-updated { border-left: 3px solid var(--purple); }

    .type-badge {
      width: 34px; height: 34px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; flex-shrink: 0;
    }
    .type-badge.assignment   { background: rgba(96,165,250,0.15);  color: var(--blue); }
    .type-badge.quiz         { background: rgba(192,132,252,0.15); color: var(--purple); }
    .type-badge.module_item  { background: rgba(251,191,36,0.12);  color: var(--yellow); }
    .type-badge.announcement { background: rgba(52,211,153,0.12);  color: var(--green); }
    .type-badge.announcement_item { background: rgba(192,132,252,0.12); color: var(--purple); }

    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 0.72rem; color: var(--muted); }

    .course-tag {
      padding: 2px 6px 2px 8px; border-radius: 5px; font-size: 0.68rem; font-weight: 500;
      color: var(--text); background: var(--surface2); border-left: 3px solid;
      white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
    }
    .tag {
      display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px;
      font-size: 0.68rem; font-weight: 600; white-space: nowrap;
    }
    .tag-new       { background: rgba(108,99,255,0.18); color: var(--accent2); }
    .tag-submitted { background: rgba(52,211,153,0.14);  color: var(--green); }
    .tag-graded    { background: rgba(96,165,250,0.14);  color: var(--blue); }
    .tag-missing   { background: rgba(248,113,113,0.14); color: var(--red); }
    .tag-untaken   { background: rgba(248,113,113,0.14); color: var(--red); }
    .tag-complete  { background: rgba(52,211,153,0.14);  color: var(--green); }
    .tag-todo      { background: rgba(251,191,36,0.14);  color: var(--yellow); }
    .tag-ai        { background: rgba(192,132,252,0.14); color: var(--purple); }
    .tag-ann       { background: rgba(192,132,252,0.14); color: var(--purple); }

    .due-pill { font-size: 0.7rem; font-weight: 500; }
    .due-pill.overdue { color: var(--red); }
    .due-pill.soon    { color: var(--yellow); }
    .due-pill.ok      { color: var(--muted); }

    .summary-list { margin-top: 8px; padding-left: 14px; list-style: disc; font-size: 0.8rem; color: var(--muted); line-height: 1.6; }
    .summary-list li { margin-bottom: 2px; }
    .ai-note { margin-top: 6px; font-size: 0.75rem; color: var(--purple); font-style: italic; }
    .card-message { font-size: 0.78rem; color: var(--muted); margin-top: 6px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-link { flex-shrink: 0; color: var(--muted); font-size: 0.78rem; padding: 4px 6px; border-radius: 6px; transition: color 0.15s, background 0.15s; align-self: flex-start; }
    .card-link:hover { color: var(--text); background: var(--surface2); }

    /* ── Calendar view ───────────────────────────────────────────────── */
    .calendar-wrap { display: flex; flex-direction: column; gap: 0; }

    /* Announcements box */
    .ann-box-wrap { margin-bottom: 24px; }
    .ann-box {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .ann-card {
      display: block; padding: 14px 16px; text-decoration: none; color: inherit;
      border-bottom: 1px solid var(--border); transition: background 0.15s;
    }
    .ann-card:last-child { border-bottom: none; }
    .ann-card:hover { background: var(--surface2); }
    .ann-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .ann-card-title { font-size: 0.875rem; font-weight: 500; margin-bottom: 4px; }
    .ann-date { font-size: 0.7rem; color: var(--muted); margin-left: auto; }
    .ann-preview { font-size: 0.78rem; color: var(--muted); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Calendar grid */
    .cal-range { font-size: 0.75rem; color: var(--muted); margin-left: 8px; }
    .cal-grid { width: 100%; border-collapse: collapse; }
    .cal-day-labels {
      display: grid; grid-template-columns: repeat(7, 1fr);
      margin-bottom: 4px;
    }
    .cal-day-label {
      text-align: center; font-size: 0.7rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
      padding: 4px 0;
    }
    .cal-weeks { display: flex; flex-direction: column; gap: 4px; }
    .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 8px 6px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.15s;
    }
    .cal-day:hover { border-color: var(--accent); }
    .cal-day.today {
      border-color: var(--accent);
      background: rgba(108,99,255,0.07);
    }
    .cal-day.past { opacity: 0.6; }
    .cal-day-num {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 2px;
      line-height: 1;
    }
    .cal-day.today .cal-day-num {
      color: var(--accent2);
    }
    .cal-day-name {
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cal-items { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .cal-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 500;
      text-decoration: none;
      color: #fff;
      background: var(--item-color, var(--accent));
      overflow: hidden;
      white-space: nowrap;
      line-height: 1.3;
      transition: opacity 0.15s, filter 0.15s;
    }
    .cal-item:hover { opacity: 0.85; filter: brightness(1.1); }
    .cal-item.done { opacity: 0.55; }
    .cal-type {
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(0,0,0,0.2);
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .cal-item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-more { font-size: 0.65rem; color: var(--muted); padding: 2px 0 0 2px; }

    /* ── Empty / loading / error ─────────────────────────────────────── */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty p { font-size: 0.88rem; }
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); gap: 10px; font-size: 0.88rem; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-banner { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: var(--radius); padding: 16px 20px; color: var(--red); font-size: 0.875rem; }

    @media (max-width: 900px) {
      .cal-day { min-height: 80px; }
      .cal-item { font-size: 0.6rem; }
    }
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .content { padding: 14px; }
      .topbar { padding: 11px 14px; }
      .search { width: 140px; }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <h1>Canvas Dashboard</h1>
      <div class="tagline">All your courses, one place</div>
    </div>

    <nav class="nav">
      <div class="nav-label">Views</div>
      <button class="nav-btn" onclick="setView('calendar', this)">Calendar</button>
      <button class="nav-btn active" onclick="setView('new', this)">
        What's New
        <span class="badge" id="badge-new">0</span>
      </button>
      <button class="nav-btn" onclick="setView('due', this)">Due Dates</button>
      <button class="nav-btn" onclick="setView('announcements', this)">Announcements</button>
      <button class="nav-btn" onclick="setView('modules', this)">Modules</button>
      <button class="nav-btn" onclick="setView('all', this)">Everything</button>

      <div class="nav-label" style="margin-top:8px">Courses</div>
      <button class="course-chip active" data-course="all" onclick="setCourse('all', this)">
        <span class="dot" style="background:var(--accent)"></span>
        <span class="course-label">All Courses</span>
      </button>
      <div id="course-list"></div>
    </nav>

    <div class="sync-info">
      Last synced
      <span class="sync-time" id="sync-time">—</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="view-title">What's New</h2>
      <input class="search" type="text" placeholder="Search..." oninput="onSearch(this.value)" id="search-box" />
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div> Loading your Canvas data...</div>
    </div>
  </main>
</div>

<script>
  let DATA = null;
  let currentView = 'new';
  let currentCourse = 'all';
  let searchQuery = '';

  const PALETTE = ['#6c63ff','#f59e0b','#10b981','#3b82f6','#ec4899','#14b8a6','#f97316','#8b5cf6','#06b6d4','#84cc16'];
  const courseColors = {};
  function courseColor(id) {
    if (!courseColors[id]) courseColors[id] = PALETTE[Object.keys(courseColors).length % PALETTE.length];
    return courseColors[id];
  }

  const DONE_STATES = new Set(['submitted', 'graded']);
  const VIEW_LABELS = { calendar: 'Calendar', new: "What's New", due: 'Due Dates', announcements: 'Announcements', modules: 'Modules', all: 'Everything' };

  // ── Load ──────────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      DATA = await res.json();
      init();
    } catch (e) {
      document.getElementById('content').innerHTML =
        `<div class="error-banner">Could not load data.json: ${e.message}<br>Run fetch_canvas.py at least once to generate this file.</div>`;
    }
  }

  function init() {
    if (DATA.last_updated) document.getElementById('sync-time').textContent = new Date(DATA.last_updated).toLocaleString();
    document.getElementById('badge-new').textContent = DATA.items.filter(i => i.is_new).length;
    buildCourseList();
    render();
  }

  function buildCourseList() {
    const container = document.getElementById('course-list');
    container.innerHTML = '';
    (DATA.courses || []).forEach(c => {
      const color = courseColor(c.id);
      const btn = document.createElement('button');
      btn.className = 'course-chip';
      btn.dataset.course = c.id;
      btn.onclick = () => setCourse(c.id, btn);
      btn.innerHTML = `<span class="dot" style="background:${color}"></span>
        <span class="course-label" title="${esc(c.name)}">${esc(c.code || c.name)}</span>`;
      container.appendChild(btn);
    });
  }

  // ── Calendar render ──────────────────────────────────────────────────
  function renderCalendarView() {
    const now = new Date();
    const todayStr = now.toDateString();

    // Week starts on Sunday
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - now.getDay());
    weekStart.setHours(0, 0, 0, 0);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 28);

    // Build date → items map
    const dayMap = {};
    DATA.items.forEach(item => {
      if (!item.due_at) return;
      if (currentCourse !== 'all' && String(item.course_id) !== String(currentCourse)) return;
      const due = new Date(item.due_at);
      if (due < weekStart || due >= weekEnd) return;
      const key = due.toDateString();
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(item);
    });

    // Sort items in each day by submission state (unsubmitted first) then title
    Object.values(dayMap).forEach(items => items.sort((a, b) => {
      const aDone = DONE_STATES.has(a.submission_state) ? 1 : 0;
      const bDone = DONE_STATES.has(b.submission_state) ? 1 : 0;
      return aDone - bDone;
    }));

    // Date range label
    const rangeStart = weekStart.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const rangeEnd = new Date(weekEnd.getTime() - 86400000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

    // Announcements
    let announcements = DATA.items
      .filter(i => i.type === 'announcement')
      .filter(i => currentCourse === 'all' || String(i.course_id) === String(currentCourse))
      .sort((a, b) => new Date(b.posted_at || 0) - new Date(a.posted_at || 0));

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      announcements = announcements.filter(i =>
        (i.title || '').toLowerCase().includes(q) || (i.message || '').toLowerCase().includes(q)
      );
    }

    const annHtml = announcements.length ? announcements.map(ann => {
      const color = courseColor(ann.course_id);
      const hasSummary = ann.summary && ann.summary.length;
      return `<a class="ann-card" href="${ann.url || '#'}" target="_blank" rel="noopener">
        <div class="ann-card-header">
          <span class="course-tag" style="border-color:${color};color:${color}" title="${esc(ann.course_name)}">${esc(ann.course_code || ann.course_name)}</span>
          ${ann.is_new ? '<span class="tag tag-new">New</span>' : ''}
          <span class="ann-date">${ann.posted_at ? fmtDate(new Date(ann.posted_at)) : ''}</span>
        </div>
        <div class="ann-card-title">${esc(ann.title)}</div>
        ${hasSummary
          ? `<ul class="summary-list">${ann.summary.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`
          : ann.message ? `<div class="ann-preview">${esc(ann.message)}</div>` : ''}
      </a>`;
    }).join('') : '<div style="padding:16px;color:var(--muted);font-size:0.85rem">No announcements.</div>';

    // Calendar grid
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const labelsHtml = dayNames.map(d => `<div class="cal-day-label">${d}</div>`).join('');

    let weeksHtml = '';
    for (let w = 0; w < 4; w++) {
      weeksHtml += '<div class="cal-week">';
      for (let d = 0; d < 7; d++) {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + w * 7 + d);
        const isToday = date.toDateString() === todayStr;
        const isPast = date < new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const key = date.toDateString();
        const dayItems = dayMap[key] || [];
        const visible = dayItems.slice(0, 4);
        const overflow = dayItems.length - visible.length;

        const itemsHtml = visible.map(item => {
          const color = courseColor(item.course_id);
          const done = DONE_STATES.has(item.submission_state);
          const overdue = !done && new Date(item.due_at) < now;
          const bg = done ? 'var(--green)' : overdue ? 'var(--red)' : color;
          const typeLabel = item.type === 'quiz' ? 'Q' : item.type === 'announcement_item' ? 'A' : '';
          return `<a class="cal-item ${done ? 'done' : ''}" href="${item.url || '#'}" target="_blank" rel="noopener"
              style="--item-color:${bg}"
              title="${esc(item.title)} — ${esc(item.course_name)}${item.due_at ? ' — Due ' + new Date(item.due_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}">
            ${typeLabel ? `<span class="cal-type">${typeLabel}</span>` : ''}
            <span class="cal-item-title">${esc(item.title)}</span>
          </a>`;
        }).join('');

        weeksHtml += `<div class="cal-day ${isToday ? 'today' : ''} ${isPast && !isToday ? 'past' : ''}">
          <div class="cal-day-num">${date.getDate()}<span class="cal-day-name" style="margin-left:4px">${isToday ? 'Today' : ''}</span></div>
          <div class="cal-items">
            ${itemsHtml}
            ${overflow > 0 ? `<div class="cal-more">+${overflow} more</div>` : ''}
          </div>
        </div>`;
      }
      weeksHtml += '</div>';
    }

    return `<div class="calendar-wrap">
      <div class="ann-box-wrap">
        <div class="section-header">
          <h3>Announcements</h3>
          <span class="section-count">${announcements.length}</span>
          <span class="section-sep"></span>
        </div>
        <div class="ann-box">${annHtml}</div>
      </div>

      <div class="section-header">
        <h3>4-Week Calendar</h3>
        <span class="cal-range">${rangeStart} — ${rangeEnd}</span>
        <span class="section-sep"></span>
      </div>
      <div class="cal-day-labels">${labelsHtml}</div>
      <div class="cal-weeks">${weeksHtml}</div>
    </div>`;
  }

  // ── List views ────────────────────────────────────────────────────────
  function filteredItems() {
    let items = DATA.items;
    if (currentCourse !== 'all') items = items.filter(i => String(i.course_id) === String(currentCourse));
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      items = items.filter(i =>
        (i.title || '').toLowerCase().includes(q) ||
        (i.course_name || '').toLowerCase().includes(q) ||
        (i.message || '').toLowerCase().includes(q) ||
        (i.module_name || '').toLowerCase().includes(q)
      );
    }
    switch (currentView) {
      case 'new': return items.filter(i => i.is_new);
      case 'due': {
        const withDue = items.filter(i => i.due_at && i.type !== 'announcement');
        return {
          upcoming: withDue.filter(i => !DONE_STATES.has(i.submission_state)).sort((a, b) => new Date(a.due_at) - new Date(b.due_at)),
          completed: withDue.filter(i => DONE_STATES.has(i.submission_state)).sort((a, b) => new Date(b.due_at) - new Date(a.due_at)),
        };
      }
      case 'announcements': return items.filter(i => i.type === 'announcement').sort((a, b) => new Date(b.posted_at || 0) - new Date(a.posted_at || 0));
      case 'modules': return items.filter(i => i.type === 'module_item').sort((a, b) => (b.position || 0) - (a.position || 0));
      default: return items;
    }
  }

  // ── Main render ───────────────────────────────────────────────────────
  function render() {
    const content = document.getElementById('content');
    document.getElementById('view-title').textContent = VIEW_LABELS[currentView] || '';
    document.getElementById('search-box').style.display = currentView === 'calendar' ? 'none' : '';

    if (currentView === 'calendar') {
      content.innerHTML = renderCalendarView();
      return;
    }

    const result = filteredItems();

    if (currentView === 'due') {
      const { upcoming, completed } = result;
      if (!upcoming.length && !completed.length) { content.innerHTML = empty('Nothing due.'); return; }
      let html = '';
      if (upcoming.length) html += sectionHeader('Upcoming', upcoming.length) + `<div class="card-grid" style="margin-bottom:28px">${upcoming.map(renderCard).join('')}</div>`;
      if (completed.length) html += sectionHeader('Completed', completed.length) + `<div class="card-grid">${completed.map(renderCard).join('')}</div>`;
      content.innerHTML = html;
      return;
    }

    const items = result;
    if (!items.length) { content.innerHTML = empty(currentView === 'new' ? 'Nothing new since the last sync.' : 'No items match your filters.'); return; }

    if (currentView === 'new') {
      content.innerHTML = renderGrouped(items);
      return;
    }

    content.innerHTML = sectionHeader('', items.length) + `<div class="card-grid">${items.map(renderCard).join('')}</div>`;
  }

  function sectionHeader(label, count) {
    return `<div class="section-header">${label ? `<h3>${label}</h3>` : ''}<span class="section-count">${count} item${count !== 1 ? 's' : ''}</span><span class="section-sep"></span></div>`;
  }
  function empty(msg) { return `<div class="empty"><p>${msg}</p></div>`; }

  function renderGrouped(items) {
    const groups = [
      { key: 'announcement',      label: 'New Announcements',       sorter: (a, b) => new Date(b.posted_at||0) - new Date(a.posted_at||0) },
      { key: 'assignment',        label: 'New Assignments',         sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'quiz',              label: 'New Quizzes',             sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'announcement_item', label: 'Dates from Announcements',sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'module_item',       label: 'New Module Content',      sorter: (a, b) => (b.position||0) - (a.position||0) },
    ];
    return groups.map(g => {
      const gItems = items.filter(i => i.type === g.key).sort(g.sorter);
      if (!gItems.length) return '';
      return sectionHeader(g.label, gItems.length) + `<div class="card-grid" style="margin-bottom:28px">${gItems.map(renderCard).join('')}</div>`;
    }).join('');
  }

  function renderCard(item) {
    const color = courseColor(item.course_id);
    const url = item.url || '#';
    const typeLabels = { assignment: 'ASGN', quiz: 'QUIZ', module_item: 'MOD', announcement: 'ANN', announcement_item: 'ANN' };

    const newTag  = item.is_new ? `<span class="tag tag-new">New</span>` : '';
    const aiTag   = item.ai_updated ? `<span class="tag tag-ai">Date updated</span>` : '';
    const annTag  = item.ai_extracted ? `<span class="tag tag-ann">From announcement</span>` : '';

    let tags = '', duePill = '', extra = '', summaryEl = '', aiNoteEl = '';

    if (['assignment', 'quiz', 'announcement_item'].includes(item.type)) {
      const stateMap = {
        submitted:      ['tag-submitted', 'Submitted'],
        graded:         ['tag-graded',    'Graded'],
        pending_review: ['tag-todo',      'Pending Review'],
        unsubmitted:    ['tag-missing',   'Not Submitted'],
        untaken:        ['tag-untaken',   'Not Taken'],
      };
      if (item.submission_state) {
        const [cls, label] = stateMap[item.submission_state] || ['tag-missing', item.submission_state];
        tags += `<span class="tag ${cls}">${label}</span>`;
      }
      if (item.grade) tags += `<span class="tag tag-graded">Grade: ${esc(item.grade)}</span>`;
      if (item.score != null && item.points_possible) tags += `<span class="tag tag-graded">${item.score}/${item.points_possible} pts</span>`;
      if (item.due_at) {
        const due = new Date(item.due_at), h = (due - new Date()) / 36e5;
        const done = DONE_STATES.has(item.submission_state);
        let cls = 'ok', prefix = 'Due ';
        if (!done && h < 0) { cls = 'overdue'; prefix = 'Overdue — '; }
        else if (!done && h < 48) cls = 'soon';
        duePill = `<span class="due-pill ${cls}">${prefix}${fmtDate(due)}</span>`;
      }
      if (item.ai_note) aiNoteEl = `<div class="ai-note">${esc(item.ai_note)}</div>`;
    }

    if (item.type === 'module_item') {
      if (item.item_type) tags += `<span class="tag tag-todo">${esc(item.item_type)}</span>`;
      if (item.completed) tags += `<span class="tag tag-complete">Done</span>`;
      else if (item.completion_requirement) tags += `<span class="tag tag-missing">To Do</span>`;
      if (item.module_name) extra = `<span>${esc(item.module_name)}</span>`;
    }

    if (item.type === 'announcement') {
      if (item.posted_at) duePill = `<span class="due-pill ok">${fmtDate(new Date(item.posted_at))}</span>`;
      summaryEl = item.summary && item.summary.length
        ? `<ul class="summary-list">${item.summary.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`
        : item.message ? `<div class="card-message">${esc(item.message)}</div>` : '';
    }

    if (item.type === 'announcement_item') {
      if (item.due_at) {
        const due = new Date(item.due_at), h = (due - new Date()) / 36e5;
        let cls = 'ok', prefix = 'Due ';
        if (h < 0) { cls = 'overdue'; prefix = 'Overdue — '; }
        else if (h < 48) cls = 'soon';
        duePill = `<span class="due-pill ${cls}">${prefix}${fmtDate(due)}</span>`;
      }
      if (item.note) extra = `<span>${esc(item.note)}</span>`;
    }

    const borderCls = item.ai_updated ? 'is-ai-updated' : dueBorderCls(item);

    return `<a class="card ${item.is_new ? 'is-new' : ''} ${borderCls}" href="${url}" target="_blank" rel="noopener">
      <div class="type-badge ${item.type}">${typeLabels[item.type] || 'ITEM'}</div>
      <div class="card-body">
        <div class="card-title" title="${esc(item.title)}">${esc(item.title)}</div>
        <div class="card-meta">
          <span class="course-tag" style="border-color:${color}" title="${esc(item.course_name)}">${esc(item.course_code || item.course_name)}</span>
          ${duePill}${extra}${tags}${newTag}${aiTag}${annTag}
        </div>
        ${summaryEl}${aiNoteEl}
      </div>
      <span class="card-link">Open</span>
    </a>`;
  }

  function dueBorderCls(item) {
    if (!item.due_at || item.type === 'announcement') return '';
    if (DONE_STATES.has(item.submission_state)) return 'is-submitted';
    const h = (new Date(item.due_at) - new Date()) / 36e5;
    if (h < 0) return 'is-overdue';
    if (h < 48) return 'is-due-soon';
    return '';
  }

  // ── Utilities ──────────────────────────────────────────────────────────
  function fmtDate(d) {
    const diff = d - new Date();
    const absDays = Math.abs(diff / 864e5);
    if (absDays < 1) { const h = Math.abs(Math.round(diff / 36e5)); return diff < 0 ? `${h}h ago` : h === 0 ? 'now' : `in ${h}h`; }
    if (absDays < 7) { const days = Math.round(absDays); return diff < 0 ? `${days}d ago` : `in ${days}d`; }
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function esc(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Controls ───────────────────────────────────────────────────────────
  function setView(view, btn) {
    currentView = view;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (DATA) render();
  }
  function setCourse(course, btn) {
    currentCourse = String(course);
    document.querySelectorAll('.course-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (DATA) render();
  }
  function onSearch(val) { searchQuery = val.trim(); if (DATA) render(); }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
