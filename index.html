<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #22263a;
      --border:   #2e3250;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e2e8f0;
      --muted:    #8892a4;
      --green:    #34d399;
      --yellow:   #fbbf24;
      --red:      #f87171;
      --blue:     #60a5fa;
      --purple:   #c084fc;
      --radius:   12px;
      --sidebar:  255px;
      --font:     'Inter', system-ui, -apple-system, sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Layout */
    .app { display: flex; flex: 1; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .logo { padding: 22px 18px 18px; border-bottom: 1px solid var(--border); }
    .logo h1 {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.2px;
    }
    .logo .tagline { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }

    .nav { padding: 10px 0; flex: 1; }
    .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 18px 4px;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 18px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.845rem;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      text-align: left;
    }
    .nav-btn:hover { color: var(--text); background: var(--surface2); }
    .nav-btn.active { color: var(--accent2); background: rgba(108,99,255,0.12); font-weight: 500; }
    .nav-btn .badge {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      font-size: 0.63rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 9px;
      min-width: 18px;
      text-align: center;
    }

    .course-filter { padding: 6px 0; border-top: 1px solid var(--border); }
    .course-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 18px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      text-align: left;
    }
    .course-chip:hover { color: var(--text); background: var(--surface2); }
    .course-chip.active { color: var(--text); font-weight: 500; }
    .course-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .course-chip .course-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sync-info { padding: 12px 18px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--muted); }
    .sync-time { color: var(--text); font-weight: 500; display: block; margin-top: 2px; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 13px 26px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .topbar h2 { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .search {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text);
      font-size: 0.83rem;
      width: 210px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--accent); }

    .content { padding: 22px 26px; flex: 1; overflow-y: auto; }

    /* Section headers */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      margin-top: 6px;
    }
    .section-header h3 { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .section-count { font-size: 0.72rem; color: var(--muted); background: var(--surface2); padding: 2px 7px; border-radius: 5px; }
    .section-sep { height: 1px; background: var(--border); flex: 1; }

    /* Cards */
    .card-grid { display: grid; gap: 9px; margin-bottom: 28px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 15px;
      display: flex;
      gap: 13px;
      align-items: flex-start;
      transition: border-color 0.15s, transform 0.1s;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card.is-new { border-color: rgba(108,99,255,0.45); background: linear-gradient(135deg, var(--surface) 0%, rgba(108,99,255,0.06) 100%); }
    .card.is-overdue { border-left: 3px solid var(--red); }
    .card.is-due-soon { border-left: 3px solid var(--yellow); }
    .card.is-submitted { border-left: 3px solid var(--green); }
    .card.is-ai-updated { border-left: 3px solid var(--purple); }

    .type-badge {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .type-badge.assignment  { background: rgba(96,165,250,0.15);  color: var(--blue); }
    .type-badge.quiz        { background: rgba(192,132,252,0.15); color: var(--purple); }
    .type-badge.module_item { background: rgba(251,191,36,0.12);  color: var(--yellow); }
    .type-badge.announcement{ background: rgba(52,211,153,0.12);  color: var(--green); }
    .type-badge.announcement_item { background: rgba(192,132,252,0.12); color: var(--purple); }

    .card-body { flex: 1; min-width: 0; }
    .card-title { font-size: 0.875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 0.72rem; color: var(--muted); }

    .course-tag {
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface2);
      border-left: 3px solid currentColor;
      white-space: nowrap;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .tag-new        { background: rgba(108,99,255,0.18); color: var(--accent2); }
    .tag-submitted  { background: rgba(52,211,153,0.14);  color: var(--green); }
    .tag-graded     { background: rgba(96,165,250,0.14);  color: var(--blue); }
    .tag-missing    { background: rgba(248,113,113,0.14); color: var(--red); }
    .tag-late       { background: rgba(251,191,36,0.14);  color: var(--yellow); }
    .tag-untaken    { background: rgba(248,113,113,0.14); color: var(--red); }
    .tag-complete   { background: rgba(52,211,153,0.14);  color: var(--green); }
    .tag-todo       { background: rgba(251,191,36,0.14);  color: var(--yellow); }
    .tag-ai         { background: rgba(192,132,252,0.14); color: var(--purple); }
    .tag-ann        { background: rgba(192,132,252,0.14); color: var(--purple); }

    .due-pill { font-size: 0.7rem; font-weight: 500; }
    .due-pill.overdue { color: var(--red); }
    .due-pill.soon    { color: var(--yellow); }
    .due-pill.ok      { color: var(--muted); }

    /* Announcement summary bullets */
    .summary-list {
      margin-top: 8px;
      padding-left: 14px;
      list-style: disc;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .summary-list li { margin-bottom: 2px; }

    /* AI note */
    .ai-note {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--purple);
      font-style: italic;
    }

    /* Card message preview */
    .card-message {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-link {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      align-self: flex-start;
    }
    .card-link:hover { color: var(--text); background: var(--surface2); }

    /* Empty / loading / error */
    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty p { font-size: 0.88rem; }
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); gap: 10px; font-size: 0.88rem; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-banner { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: var(--radius); padding: 16px 20px; color: var(--red); font-size: 0.875rem; }

    @media (max-width: 680px) {
      .sidebar { display: none; }
      .content { padding: 14px; }
      .topbar { padding: 11px 14px; }
      .search { width: 140px; }
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">
      <h1>Canvas Dashboard</h1>
      <div class="tagline">All your courses, one place</div>
    </div>

    <nav class="nav">
      <div class="nav-label">Views</div>
      <button class="nav-btn active" onclick="setView('new', this)">
        What's New
        <span class="badge" id="badge-new">0</span>
      </button>
      <button class="nav-btn" onclick="setView('due', this)">Due Dates</button>
      <button class="nav-btn" onclick="setView('announcements', this)">Announcements</button>
      <button class="nav-btn" onclick="setView('modules', this)">Modules</button>
      <button class="nav-btn" onclick="setView('all', this)">Everything</button>

      <div class="nav-label" style="margin-top:8px">Courses</div>
      <button class="course-chip active" data-course="all" onclick="setCourse('all', this)">
        <span class="dot" style="background:var(--accent)"></span>
        <span class="course-label">All Courses</span>
      </button>
      <div id="course-list"></div>
    </nav>

    <div class="sync-info">
      Last synced
      <span class="sync-time" id="sync-time">—</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="view-title">What's New</h2>
      <input class="search" type="text" placeholder="Search..." oninput="onSearch(this.value)" />
    </div>
    <div class="content" id="content">
      <div class="loading"><div class="spinner"></div> Loading your Canvas data...</div>
    </div>
  </main>
</div>

<script>
  let DATA = null;
  let currentView = 'new';
  let currentCourse = 'all';
  let searchQuery = '';

  const PALETTE = ['#6c63ff','#f59e0b','#10b981','#3b82f6','#ec4899','#14b8a6','#f97316','#8b5cf6','#06b6d4','#84cc16'];
  const courseColors = {};
  function courseColor(id) {
    if (!courseColors[id]) {
      courseColors[id] = PALETTE[Object.keys(courseColors).length % PALETTE.length];
    }
    return courseColors[id];
  }

  // ── Load ─────────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      DATA = await res.json();
      init();
    } catch (e) {
      document.getElementById('content').innerHTML =
        `<div class="error-banner">Could not load data.json: ${e.message}<br>
        Run fetch_canvas.py at least once to generate this file.</div>`;
    }
  }

  function init() {
    if (DATA.last_updated) {
      document.getElementById('sync-time').textContent = new Date(DATA.last_updated).toLocaleString();
    }
    const newCount = DATA.items.filter(i => i.is_new).length;
    document.getElementById('badge-new').textContent = newCount;
    buildCourseList();
    render();
  }

  function buildCourseList() {
    const container = document.getElementById('course-list');
    container.innerHTML = '';
    (DATA.courses || []).forEach(c => {
      const color = courseColor(c.id);
      const btn = document.createElement('button');
      btn.className = 'course-chip';
      btn.dataset.course = c.id;
      btn.onclick = () => setCourse(c.id, btn);
      btn.innerHTML = `<span class="dot" style="background:${color}"></span>
        <span class="course-label" title="${esc(c.name)}">${esc(c.code || c.name)}</span>`;
      container.appendChild(btn);
    });
  }

  // ── Filtering & sorting ──────────────────────────────────────────────
  const SUBMITTED_STATES = new Set(['submitted', 'graded', 'complete', 'pending_review']);
  const DONE_STATES = new Set(['submitted', 'graded']);

  function isComplete(item) {
    if (item.type === 'module_item') return !!item.completed;
    if (item.type === 'announcement' || item.type === 'announcement_item') return false;
    return DONE_STATES.has(item.submission_state);
  }

  function filteredItems() {
    let items = DATA.items;

    if (currentCourse !== 'all') {
      items = items.filter(i => String(i.course_id) === String(currentCourse));
    }

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      items = items.filter(i =>
        (i.title || '').toLowerCase().includes(q) ||
        (i.course_name || '').toLowerCase().includes(q) ||
        (i.message || '').toLowerCase().includes(q) ||
        (i.module_name || '').toLowerCase().includes(q)
      );
    }

    switch (currentView) {
      case 'new':
        return items.filter(i => i.is_new);

      case 'due': {
        const withDue = items.filter(i => i.due_at && i.type !== 'announcement');
        const upcoming = withDue
          .filter(i => !isComplete(i))
          .sort((a, b) => new Date(a.due_at) - new Date(b.due_at));
        const completed = withDue
          .filter(i => isComplete(i))
          .sort((a, b) => new Date(b.due_at) - new Date(a.due_at));
        return { upcoming, completed };
      }

      case 'announcements':
        return items
          .filter(i => i.type === 'announcement')
          .sort((a, b) => new Date(b.posted_at || 0) - new Date(a.posted_at || 0));

      case 'modules':
        return items
          .filter(i => i.type === 'module_item')
          .sort((a, b) => (b.position || 0) - (a.position || 0));

      case 'all':
      default:
        return items;
    }
  }

  // ── Render ───────────────────────────────────────────────────────────
  const VIEW_LABELS = {
    new: "What's New", due: 'Due Dates',
    announcements: 'Announcements', modules: 'Modules', all: 'Everything'
  };

  function render() {
    const result = filteredItems();
    const content = document.getElementById('content');
    document.getElementById('view-title').textContent = VIEW_LABELS[currentView] || '';

    // Due dates view returns an object with upcoming/completed
    if (currentView === 'due') {
      const { upcoming, completed } = result;
      if (!upcoming.length && !completed.length) {
        content.innerHTML = emptyState('Nothing due.');
        return;
      }
      let html = '';
      if (upcoming.length) {
        html += sectionHeader('Upcoming', upcoming.length);
        html += `<div class="card-grid" style="margin-bottom:28px">${upcoming.map(renderCard).join('')}</div>`;
      }
      if (completed.length) {
        html += sectionHeader('Completed', completed.length);
        html += `<div class="card-grid">${completed.map(renderCard).join('')}</div>`;
      }
      content.innerHTML = html;
      return;
    }

    const items = result;

    if (!items.length) {
      content.innerHTML = emptyState(currentView === 'new' ? 'Nothing new since the last sync.' : 'No items match your filters.');
      return;
    }

    if (currentView === 'new') {
      content.innerHTML = renderGrouped(items);
      return;
    }

    content.innerHTML = `
      ${sectionHeader('', items.length)}
      <div class="card-grid">${items.map(renderCard).join('')}</div>`;
  }

  function sectionHeader(label, count) {
    return `<div class="section-header">
      ${label ? `<h3>${label}</h3>` : ''}
      <span class="section-count">${count} item${count !== 1 ? 's' : ''}</span>
      <span class="section-sep"></span>
    </div>`;
  }

  function emptyState(msg) {
    return `<div class="empty"><p>${msg}</p></div>`;
  }

  function renderGrouped(items) {
    const groups = [
      { key: 'announcement',      label: 'New Announcements',    sorter: (a, b) => new Date(b.posted_at||0) - new Date(a.posted_at||0) },
      { key: 'assignment',        label: 'New Assignments',       sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'quiz',              label: 'New Quizzes',           sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'announcement_item', label: 'Dates from Announcements', sorter: (a, b) => new Date(a.due_at||'9999') - new Date(b.due_at||'9999') },
      { key: 'module_item',       label: 'New Module Content',    sorter: (a, b) => (b.position||0) - (a.position||0) },
    ];

    return groups
      .map(g => {
        const gItems = items.filter(i => i.type === g.key).sort(g.sorter);
        if (!gItems.length) return '';
        return `${sectionHeader(g.label, gItems.length)}
          <div class="card-grid" style="margin-bottom:28px">${gItems.map(renderCard).join('')}</div>`;
      })
      .join('');
  }

  function renderCard(item) {
    const color = courseColor(item.course_id);
    const url = item.url || '#';

    const typeLabels = { assignment: 'ASGN', quiz: 'QUIZ', module_item: 'MOD', announcement: 'ANN', announcement_item: 'ANN' };
    const typeLabel = typeLabels[item.type] || 'ITEM';

    const newTag = item.is_new ? `<span class="tag tag-new">New</span>` : '';
    const aiTag = item.ai_updated ? `<span class="tag tag-ai">Date updated</span>` : '';
    const annTag = item.ai_extracted ? `<span class="tag tag-ann">From announcement</span>` : '';

    let tags = '';
    let duePill = '';
    let extra = '';
    let summaryEl = '';
    let aiNoteEl = '';

    // Submission / quiz status
    if (item.type === 'assignment' || item.type === 'quiz' || item.type === 'announcement_item') {
      const state = item.submission_state;
      if (state) {
        const stateMap = {
          submitted:      ['tag-submitted', 'Submitted'],
          graded:         ['tag-graded',    'Graded'],
          pending_review: ['tag-late',      'Pending Review'],
          unsubmitted:    ['tag-missing',   'Not Submitted'],
          untaken:        ['tag-untaken',   'Not Taken'],
        };
        const [cls, label] = stateMap[state] || ['tag-missing', state];
        tags += `<span class="tag ${cls}">${label}</span>`;
      }
      if (item.grade) tags += `<span class="tag tag-graded">Grade: ${esc(item.grade)}</span>`;
      if (item.score != null && item.points_possible)
        tags += `<span class="tag tag-graded">${item.score}/${item.points_possible} pts</span>`;

      if (item.due_at) {
        const due = new Date(item.due_at);
        const now = new Date();
        const h = (due - now) / 36e5;
        const done = DONE_STATES.has(item.submission_state);
        let cls = 'ok', prefix = 'Due ';
        if (!done && h < 0)   { cls = 'overdue'; prefix = 'Overdue — '; }
        else if (!done && h < 48) { cls = 'soon'; }
        duePill = `<span class="due-pill ${cls}">${prefix}${fmtDate(due)}</span>`;
      }

      if (item.ai_note) {
        aiNoteEl = `<div class="ai-note">${esc(item.ai_note)}</div>`;
      }
    }

    // Module item
    if (item.type === 'module_item') {
      if (item.item_type) tags += `<span class="tag tag-todo">${esc(item.item_type)}</span>`;
      if (item.completed) tags += `<span class="tag tag-complete">Done</span>`;
      else if (item.completion_requirement) tags += `<span class="tag tag-missing">To Do</span>`;
      if (item.module_name) extra = `<span>${esc(item.module_name)}</span>`;
    }

    // Announcement
    if (item.type === 'announcement') {
      if (item.posted_at) duePill = `<span class="due-pill ok">${fmtDate(new Date(item.posted_at))}</span>`;
      if (item.summary && item.summary.length) {
        summaryEl = `<ul class="summary-list">${item.summary.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
      } else if (item.message) {
        summaryEl = `<div class="card-message">${esc(item.message)}</div>`;
      }
    }

    // Announcement-extracted item
    if (item.type === 'announcement_item') {
      if (item.due_at) {
        const due = new Date(item.due_at);
        const h = (due - new Date()) / 36e5;
        let cls = 'ok', prefix = 'Due ';
        if (h < 0) { cls = 'overdue'; prefix = 'Overdue — '; }
        else if (h < 48) { cls = 'soon'; }
        duePill = `<span class="due-pill ${cls}">${prefix}${fmtDate(due)}</span>`;
      }
      if (item.note) extra = `<span>${esc(item.note)}</span>`;
    }

    const borderCls = item.ai_updated ? 'is-ai-updated' : dueBorderCls(item);

    return `<a class="card ${item.is_new ? 'is-new' : ''} ${borderCls}" href="${url}" target="_blank" rel="noopener">
      <div class="type-badge ${item.type}">${typeLabel}</div>
      <div class="card-body">
        <div class="card-title" title="${esc(item.title)}">${esc(item.title)}</div>
        <div class="card-meta">
          <span class="course-tag" style="color:${color}" title="${esc(item.course_name)}">${esc(item.course_code || item.course_name)}</span>
          ${duePill}
          ${extra}
          ${tags}
          ${newTag}${aiTag}${annTag}
        </div>
        ${summaryEl}
        ${aiNoteEl}
      </div>
      <span class="card-link">Open</span>
    </a>`;
  }

  function dueBorderCls(item) {
    if (!item.due_at || item.type === 'announcement') return '';
    if (DONE_STATES.has(item.submission_state)) return 'is-submitted';
    const h = (new Date(item.due_at) - new Date()) / 36e5;
    if (h < 0) return 'is-overdue';
    if (h < 48) return 'is-due-soon';
    return '';
  }

  // ── Utilities ────────────────────────────────────────────────────────
  function fmtDate(d) {
    const diff = d - new Date();
    const absDays = Math.abs(diff / 864e5);
    if (absDays < 1) {
      const h = Math.abs(Math.round(diff / 36e5));
      if (diff < 0) return `${h}h ago`;
      return h === 0 ? 'now' : `in ${h}h`;
    }
    if (absDays < 7) {
      const days = Math.round(absDays);
      return diff < 0 ? `${days}d ago` : `in ${days}d`;
    }
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function esc(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Controls ─────────────────────────────────────────────────────────
  function setView(view, btn) {
    currentView = view;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (DATA) render();
  }

  function setCourse(course, btn) {
    currentCourse = String(course);
    document.querySelectorAll('.course-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (DATA) render();
  }

  function onSearch(val) {
    searchQuery = val.trim();
    if (DATA) render();
  }

  loadData();
  setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
